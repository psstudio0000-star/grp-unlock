<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grp Unlock</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Adsgram SDK -->
  <script src="https://sad.adsgram.ai/js/sad-index.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0b0c10;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 360px;
      background: #14161d;
      padding: 24px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
      border: 1px solid #1f222e;
    }
    h2 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }
    /* Progress Bar */
    .progress-container {
      width: 100%;
      height: 14px;
      background-color: #232733;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #0088cc, #00bfff);
      transition: width 0.3s ease;
    }
    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #8a8f9d;
      margin-bottom: 24px;
      font-weight: 500;
    }
    /* Action Buttons */
    .btn {
      width: 100%;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-bottom: 12px;
      transition: opacity 0.2s;
    }
    .btn:active {
      opacity: 0.8;
    }
    .btn-share {
      background-color: #007aff;
      color: #ffffff;
    }
    .btn-unlock {
      background-color: #232733;
      color: #ffffff;
      border: 1px solid #2d3242;
    }
    #status {
      font-size: 13px;
      margin-top: 8px;
      min-height: 18px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>HIDDEN CAM IS LOCKED</h2>

    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    
    <div class="progress-info">
      <span id="percentText">0% Completed</span>
      <span id="taskCountText">0 / 5 Tasks</span>
    </div>

    <!-- Share Button -->
    <button class="btn btn-share" id="shareBtn">SHARE</button>

    <!-- Ad Unlock Button -->
    <button class="btn btn-unlock" id="unlockBtn">UNLOCK VIDEOS (0/5)</button>

    <div id="status"></div>
  </div>

  <script>
    // 1. Telegram WebApp Setup
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // 2. Settings
    const ADSGRAM_BLOCK_ID = "40102"; 
    const TOTAL_TASKS = 5;
    let completedTasks = 0;

    const progressBar = document.getElementById('progressBar');
    const percentText = document.getElementById('percentText');
    const taskCountText = document.getElementById('taskCountText');
    const unlockBtn = document.getElementById('unlockBtn');
    const shareBtn = document.getElementById('shareBtn');
    const statusDiv = document.getElementById('status');

    // 3. UI Update Logic
    function updateUI() {
      const percentage = Math.round((completedTasks / TOTAL_TASKS) * 100);
      progressBar.style.width = percentage + '%';
      percentText.innerText = percentage + '% Completed';
      taskCountText.innerText = `${completedTasks} / ${TOTAL_TASKS} Tasks`;
      
      if (completedTasks >= TOTAL_TASKS) {
        unlockBtn.innerText = "🎉 ACCESS UNLOCKED!";
        unlockBtn.style.backgroundColor = "#4caf50";
      } else {
        unlockBtn.innerText = `UNLOCK VIDEOS (${completedTasks}/${TOTAL_TASKS})`;
      }
    }

    // 4. Handle Ad Completion
    unlockBtn.addEventListener('click', async () => {
      if (completedTasks >= TOTAL_TASKS) {
        statusDiv.style.color = '#4caf50';
        statusDiv.innerText = "You have already unlocked all tasks!";
        return;
      }

      if (!window.Adsgram) {
        statusDiv.style.color = '#ff5252';
        statusDiv.innerText = "Adsgram SDK loading... try again shortly.";
        return;
      }

      statusDiv.style.color = '#8a8f9d';
      statusDiv.innerText = "Loading ad...";

      try {
        const AdController = window.Adsgram.init({ blockId: ADSGRAM_BLOCK_ID });
        await AdController.show();

        // On successful ad watch
        completedTasks++;
        updateUI();

        statusDiv.style.color = '#4caf50';
        statusDiv.innerText = `✅ Task ${completedTasks} completed!`;
        if (tg) tg.HapticFeedback?.notificationOccurred('success');

      } catch (error) {
        statusDiv.style.color = '#ff5252';
        statusDiv.innerText = "❌ Ad skipped or failed to load. Try again.";
        if (tg) tg.HapticFeedback?.notificationOccurred('error');
      }
    });

    // 5. Telegram Share Button
    shareBtn.addEventListener('click', () => {
      const shareUrl = "https://t.me/grpbotlock_bot/aza";
      const text = "Watch videos and unlock exclusive content!";
      const fullShareLink = `https://t.me/share/url?url=${encodeURIComponent(shareUrl)}&text=${encodeURIComponent(text)}`;
      
      if (tg && tg.openTelegramLink) {
        tg.openTelegramLink(fullShareLink);
      } else {
        window.open(fullShareLink, '_blank');
      }
    });
  </script>

</body>
</html>
